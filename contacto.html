<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>One Piece - La Gran Ruta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">
</head>

  <body>
    <div class="container"> 

        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="#">
            One Piece
        </a>

        <div class="navbar-nav">

            <a class="nav-link" href="https://www.google.cl">
                Inicio
            </a>

            <a class="nav-link" href="https://www.duocuc.cl">
                Personajes
            </a>

            <a class="nav-link" href="contacto.html">
                Contacto
            </a>

        </div>

    </div>

</nav>

    <header>

        <h1 class = "text-center mt-5">🏴‍☠️ El Tesoro del One Piece</h1>

        <p class = "text-center">

            Bienvenido a la Gran Ruta Pirata
        </p>
         
    </header>

  <section id="contacto"
             class="container my-5">

        <h2 class="text-center mb-4">
            Contacto
        </h2>


        <div class="row">

            <div class="col-12 col-md-8 col-lg-6 mx-auto">

                <form>


                    <!-- NOMBRE -->

                    <div class="mb-3">

                        <label for="nombre"
                               class="form-label">
                            Nombre
                        </label>

                        <input type="text"
                               id="nombre"
                               class="form-control"
                               placeholder="Ingrese su nombre">

                    </div>


                    <!-- CORREO -->

                    <div class="mb-3">

                        <label for="correo"
                               class="form-label">
                            Correo electrónico
                        </label>

                        <input type="email"
                               id="correo"
                               class="form-control"
                               placeholder="nombre@correo.com">

                    </div>


                    <!-- PERSONAJE -->

                    <div class="mb-3">

                        <label for="personaje"
                               class="form-label">
                            Personaje favorito
                        </label>

                        <select id="personaje"
                                class="form-select">

                            <option>
                                Luffy
                            </option>

                            <option>
                                Zoro
                            </option>

                            <option>
                                Nami
                            </option>

                        </select>

                    </div>


                    <!-- MENSAJE -->

                    <div class="mb-3">

                        <label for="mensaje"
                               class="form-label">
                            Mensaje
                        </label>

                        <textarea id="mensaje"
                                  class="form-control"
                                  rows="4"
                                  placeholder="Escriba su mensaje">
                        </textarea>

                    </div>


                    <!-- BOTÓN -->

                    <button type="submit"
                            class="btn btn-primary">
                        Enviar mensaje
                    </button>


                </form>

            </div>

        </div>

    </section>
    </body>
